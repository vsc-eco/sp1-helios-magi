[workspace]
members = ["primitives", "script", "program"]
resolver = "2"

[workspace.package]
license = "MIT"
edition = "2021"
authors = ["vsc-eco"]
homepage = "https://github.com/vsc-eco/sp1-helios-magi"
repository = "https://github.com/vsc-eco/sp1-helios-magi"

[workspace.dependencies]
# magi-zk-oracle
magi-zk-oracle-script = { path = "script" }
magi-zk-oracle-program = { path = "program" }
magi-zk-oracle-primitives = { path = "primitives" }

# helios (a16z)
helios = { git = "https://github.com/a16z/helios", tag = "0.10.2" }
helios-consensus-core = { git = "https://github.com/a16z/helios", tag = "0.10.2" }
helios-ethereum = { git = "https://github.com/a16z/helios", tag = "0.10.2" }

# sp1
sp1-sdk = "6.1.0"
sp1-build = "6.1.0"

# general
tokio = "1.38.0"
tracing = "0.1.37"
serde = "1.0.203"
serde_cbor = "0.11.2"
serde_json = "1.0.125"
hex = "0.4.3"
sha2 = "0.10.8"
alloy-sol-types = "1.3.0"
alloy-trie = "0.9.1"
alloy-rlp = { version = "0.3.9", default-features = false, features = [
    "derive",
    "arrayvec",
] }
alloy-primitives = "1.3.0"
anyhow = "1.0.86"
reqwest = "0.12.5"
tree_hash = "0.10.0"

[patch.crates-io]
sha2-v0-9-9 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.9.9-sp1-4.0.0" }
sha2-v0-10-8 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.8-sp1-4.0.0" }
sha3-v0-10-8 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha3", tag = "patch-sha3-0.10.8-sp1-4.0.0" }
tiny-keccak = { git = "https://github.com/sp1-patches/tiny-keccak", tag = "patch-2.0.2-sp1-4.0.0" }
bls12_381 = { git = "https://github.com/sp1-patches/bls12_381", tag = "patch-0.8.0-sp1-5.0.0-v2" }
# From upstream: https://github.com/a16z/helios/blob/master/Cargo.toml#L115
ethereum_hashing = { git = "https://github.com/ncitron/ethereum_hashing", rev = "7ee70944ed4fabe301551da8c447e4f4ae5e6c35" }
