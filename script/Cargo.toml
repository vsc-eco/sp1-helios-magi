[package]
version.workspace = true
name = "sp1-helios-script"
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "vkey"
path = "./bin/vkey.rs"

[[bin]]
name = "gen_fixture"
path = "./bin/gen_fixture.rs"

[[bin]]
name = "validate_fixture"
path = "./bin/validate_fixture.rs"

[features]
cuda = ["sp1-sdk/cuda"]

[dependencies]
sp1-sdk = { workspace = true }
tokio = { workspace = true }
helios-consensus-core = { workspace = true }
helios-ethereum = { workspace = true }
sp1-helios-primitives = { workspace = true }
serde = { workspace = true }
serde_cbor = { workspace = true }
alloy-primitives = { workspace = true }
alloy-consensus = { workspace = true }
alloy-rlp = { workspace = true }
alloy-trie = { workspace = true }
alloy = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
cargo_metadata = { workspace = true }
dotenv = { workspace = true }
futures = "0.3.31"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
reqwest = { workspace = true }
tree_hash = { workspace = true }
serde_json = { workspace = true }
tracing.workspace = true
sha2 = { workspace = true }
hex = { workspace = true }

[build-dependencies]
sp1-build = { workspace = true }

[[bin]]
name = "benchmark"
path = "bin/benchmark.rs"

[[bin]]
name = "magi_operator"
path = "bin/magi_operator.rs"
