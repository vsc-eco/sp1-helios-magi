name: ELF reproducibility

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'program/**'
      - 'primitives/**'
      - 'elf/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'script/build.rs'
      - 'script/rust-toolchain'
      - '.github/workflows/elf-reproducibility.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # MED-39 / MED-74 (Z-PR-M2, F7): third-party actions pinned by immutable
      # commit SHA so a compromised/re-tagged action cannot backdoor the ELF
      # reproducibility check. Trailing comment records the human-readable tag.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-03-27
        with:
          toolchain: '1.93.1'
          components: llvm-tools, rustc-dev

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-elf-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-elf-

      - name: Cache SP1 build Docker image
        uses: ScribeMD/docker-cache@fb28c93772363301b8d0a6072ce850224b73f74e # 0.5.0
        with:
          key: sp1-build-v6.8.1

      # Triggers script/build.rs, which invokes the SP1 build inside the
      # ghcr.io/succinctlabs/sp1:v6.8.1 container (pinned by digest) and writes ELFs to elf/.
      # cargo check is enough: we only need build.rs to run, not the host link.
      - name: Rebuild ELFs reproducibly via Docker
        run: cargo check -p sp1-helios-script

      - name: Verify committed ELFs match Docker output
        run: |
          if ! git diff --exit-code elf/; then
            echo "::error::Committed ELFs do not match the reproducible Docker build."
            echo "::error::This usually means someone committed a non-Docker local build."
            echo "::error::To fix: rebuild with docker enabled in script/build.rs and commit the result."
            echo ""
            echo "Affected files:"
            git diff --name-only elf/
            exit 1
          fi
          echo "ELFs match Docker output. Reproducibility verified."
